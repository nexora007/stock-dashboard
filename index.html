<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Stock Terminal — Real-Time, Financials & Calculators</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <!-- Top Bar -->
    <header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-emerald-400">Pro Stock Terminal</h1>
        <p class="text-xs md:text-sm text-slate-400">Real-Time Quote • Financial Statements • Valuation & Risk Calculators</p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <!-- Autocomplete Search Box -->
        <div class="relative w-64" id="search-container">
          <div class="flex items-center bg-slate-900 border border-slate-700 focus-within:border-emerald-400 rounded-lg px-2.5 py-1.5 gap-2">
            <span id="search-badge" class="w-6 h-6 rounded-md bg-emerald-500/15 text-emerald-400 text-[11px] font-bold flex items-center justify-center shrink-0">
              NV
            </span>
            <input id="ticker-input" type="text" value="NVDA" autocomplete="off"
              placeholder="พิมพ์ชื่อ หรือ ตัวย่อหุ้น..."
              class="bg-transparent text-sm uppercase w-full focus:outline-none text-slate-100 placeholder-slate-500" />
          </div>

          <!-- Dropdown Suggestions -->
          <div id="suggestions-dropdown"
            class="hidden absolute left-0 right-0 mt-1.5 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-72 overflow-y-auto z-50 divide-y divide-slate
